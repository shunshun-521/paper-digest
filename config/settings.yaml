timezone: Asia/Shanghai
papers_per_day: 5            # 邮件里最终推送篇数（3~5）
candidates_on_page: 12       # 网页版保留的候选数（前端复选框从中筛选）
journal_items_max: 2         # 期刊栏目最多几篇

llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash      # 可改；必须可配置，不要写死
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.3
  use_vision: true           # 用多模态挑关键图；失败自动退回 caption 判断
  max_input_chars: 120000    # 喂给模型的正文上限

sources:
  alphaxiv_for_you: true
  alphaxiv_hot: true
  hf_daily: true
  arxiv_fallback_categories: [cs.CL, cs.LG, cs.CV, cs.AI]

notify:
  email: false                  # 未配置 SMTP 时保持 false；以后要邮件再改 true
  wechat: true
  wechat_provider: serverchan   # serverchan | pushplus

deploy:
  target: cloudflare            # cloudflare | github_pages | none
  site_base_url: "https://paper-digest.pages.dev"  # 用稳定域名；带哈希的预览地址每次部署会变
