name: Daily Paper Digest

on:
  schedule:
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑预览，不发送、不部署、不提交"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ALPHAXIV_API_KEY: ${{ secrets.ALPHAXIV_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m digest run --dry-run
          else
            python -m digest run
          fi

      - name: Check Cloudflare secrets
        id: cf
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          echo "CLOUDFLARE_API_TOKEN set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo NO)"
          echo "CLOUDFLARE_ACCOUNT_ID set: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo NO)"
          echo "CF_PAGES_PROJECT set: $([ -n "$CF_PAGES_PROJECT" ] && echo yes || echo NO)"
          echo "CF_PAGES_PROJECT value: ${CF_PAGES_PROJECT:-<empty>}"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CF_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy will run"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets incomplete, skip deploy. Need CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CF_PAGES_PROJECT"
          fi

      - name: Deploy Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ secrets.CF_PAGES_PROJECT }}

      - name: Cloudflare deploy skipped notice
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.cf.outputs.enabled != 'true' }}
        run: echo "::warning::Deploy Cloudflare Pages was skipped. Open the Check Cloudflare secrets step above."

      - name: Commit archive and site
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            day=$(ls data/archive/*.json | sort | tail -n 1 | xargs -n 1 basename | sed 's/.json$//')
            git commit -m "digest: ${day}"
            git push
          fi
